<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sala Flash Activa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #1a252f; color: white; display: flex; flex-direction: column; height: 100vh; font-family: 'Segoe UI', sans-serif; }
        .pin-box { font-size: 5rem; letter-spacing: 10px; font-weight: 900; color: #ffc107; text-shadow: 0px 4px 15px rgba(255, 193, 7, 0.4); }
        .student-card { background: rgba(255,255,255,0.1); border-radius: 12px; padding: 15px; text-align: center; border: 1px solid rgba(255,255,255,0.2); }
    </style>
</head>
<body>

<div class="container text-center mt-5 flex-grow-1">
    <h4 class="text-white-50 text-uppercase tracking-wide"><i class="bi bi-broadcast"></i> Sala de Evaluación Activa</h4>
    <p class="mb-1 mt-4">Pide a tus alumnos que ingresen este PIN para unirse:</p>
    
    <div class="pin-box mb-5">{{ pin }}</div>
    
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h5 class="mb-4 border-bottom border-secondary pb-2">Alumnos Conectados (0)</h5>
            <!-- Aquí irán apareciendo los alumnos con Socket.IO más adelante -->
            <div class="row" id="lista_alumnos">
                <div class="col-12 text-muted small"><i class="bi bi-hourglass-split"></i> Esperando conexiones...</div>
            </div>
        </div>
    </div>
</div>

<div class="bg-dark p-3 text-center border-top border-secondary mt-auto">
    <form action="/cerrar_sala/{{ pin }}" method="POST" onsubmit="return confirm('¿Estás seguro de cerrar esta sala? Todos los alumnos serán desconectados.');">
        <button type="submit" class="btn btn-danger fw-bold px-5 py-2"><i class="bi bi-stop-circle-fill"></i> Terminar Evaluación Flash</button>
    </form>
</div>

</body>
</html>
