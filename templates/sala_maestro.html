<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sala Flash Activa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ===== AuraLab · diseño elevado ===== */
        :root { --navy: #0d1b3e; --blue: #0a7dff; --teal: #00c9b7; --ink: #5a6b85; --line: rgba(13,27,62,.08); }
        ::selection { background: rgba(10,125,255,.22); }
        body { background: radial-gradient(900px 480px at 50% -10%, rgba(10,125,255,.12), transparent 60%), radial-gradient(700px 420px at 90% 90%, rgba(0,201,183,.10), transparent 60%), #f2f6fb; color: #0d1b3e; display: flex; flex-direction: column; height: 100vh; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
        h1, h2, h3, h4, h5, h6 { font-family: 'Sora', 'Plus Jakarta Sans', system-ui, sans-serif; }
        .brand-simbolo { height: 46px; }
        .brand-nombre { height: 30px; }
        .tracking-wide { letter-spacing: .14em; }
        h4 { color: #5a6b85; font-weight: 700; font-size: 1.05rem; }
        .container h5 { font-weight: 700; color: #0d1b3e; letter-spacing: .01em; }
        .border-secondary { border-color: rgba(13,27,62,.14) !important; }
        p { color: #5a6b85; }
        .pin-box { font-family: 'Sora', 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 5rem; letter-spacing: 10px; font-weight: 800; background: linear-gradient(90deg, #0a7dff 0%, #00c9b7 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 12px 26px rgba(10,125,255,.35)); }
        .student-card { background: rgba(255,255,255,.92); border-radius: 16px; padding: 15px; text-align: center; border: 1px solid rgba(255,255,255,.75); box-shadow: 0 10px 30px rgba(13,27,62,.08); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); color: #0d1b3e; transition: transform .2s ease, box-shadow .2s ease; }
        .student-card:hover { transform: translateY(-2px); box-shadow: 0 16px 36px rgba(13,27,62,.12); }
        .text-white-50 { color: rgba(13,27,62,0.55) !important; }
        .bg-dark { background: linear-gradient(90deg, #0d1b3e, #122a5e) !important; box-shadow: 0 -10px 30px rgba(13,27,62,.20); }
        .btn-danger { background: linear-gradient(90deg, #e5484d, #f2555a); border: none; border-radius: 12px; box-shadow: 0 10px 24px rgba(229,72,77,.35); transition: transform .2s ease, box-shadow .2s ease, filter .2s ease; }
        .btn-danger:hover { filter: brightness(1.06); transform: translateY(-1px); box-shadow: 0 14px 30px rgba(229,72,77,.42); }
        .container { position: relative; }
        .wm-sala { position: absolute; right: -10px; top: -10px; width: 170px; opacity: 0.05; pointer-events: none; }
    </style>
</head>
<body>

<div class="container text-center mt-5 flex-grow-1">
    <img src="{{ url_for('static', filename='img/marca-agua-azul-marino.png') }}" alt="" class="wm-sala">
    <div class="mb-2 d-flex justify-content-center align-items-center gap-2">
        <img src="{{ url_for('static', filename='img/logo-simbolo.png') }}" alt="AuraLab" class="brand-simbolo">
        <img src="{{ url_for('static', filename='img/logo-nombre.png') }}" alt="AuraLab" class="brand-nombre">
    </div>
    <h4 class="text-white-50 text-uppercase tracking-wide"><i class="bi bi-broadcast"></i> Sala de Evaluación Activa</h4>
    <p class="mb-1 mt-4">Pide a tus alumnos que ingresen este PIN para unirse:</p>
    
    <div class="pin-box mb-5">{{ pin }}</div>
    
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h5 class="mb-4 border-bottom border-secondary pb-2">Alumnos Conectados (0)</h5>
            <!-- Aquí irán apareciendo los alumnos con Socket.IO más adelante -->
            <div class="row" id="lista_alumnos">
                <div class="col-12 text-muted small"><i class="bi bi-hourglass-split"></i> Esperando conexiones...</div>
            </div>
        </div>
    </div>
</div>

<div class="bg-dark p-3 text-center border-top border-secondary mt-auto">
    <form action="/cerrar_sala/{{ pin }}" method="POST" onsubmit="return confirm('¿Estás seguro de cerrar esta sala? Todos los alumnos serán desconectados.');">
        <button type="submit" class="btn btn-danger fw-bold px-5 py-2"><i class="bi bi-stop-circle-fill"></i> Terminar Evaluación Flash</button>
    </form>
</div>

</body>
</html>
