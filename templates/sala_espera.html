<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sala de Espera - AuraLab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f2f6fb; color: #0d1b3e; font-family: 'Segoe UI', Tahoma, sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card-espera { background-color: #ffffff; border-radius: 20px; border: none; width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(13,27,62,0.10); position: relative; overflow: hidden; }
        .card-espera > * { position: relative; z-index: 1; }
        .card-espera > .wm { position: absolute; z-index: 0; right: -18px; bottom: -18px; width: 180px; opacity: .05; pointer-events: none; }
        .card-espera .text-white-50 { color: rgba(13,27,62,.6) !important; }
        .card-espera .text-light { color: #0d1b3e !important; }
        .card-espera .alert { background-color: #eef4fb !important; }
        .spinner-border { width: 3rem; height: 3rem; color: #0a7dff; }
        .logo-simbolo { height: 44px; }
        .logo-nombre { height: 28px; }
    </style>
</head>
<body>

<div class="card card-espera p-5 text-center">
    <div class="mb-3 d-flex justify-content-center align-items-center gap-2">
        <img src="{{ url_for('static', filename='img/logo-simbolo.png') }}" alt="AuraLab" class="logo-simbolo">
        <img src="{{ url_for('static', filename='img/logo-nombre.png') }}" alt="AuraLab" class="logo-nombre">
    </div>
    <div class="mb-4">
        <div class="spinner-border mb-3" role="status"></div>
        <h3 class="fw-bold">¡Bienvenido, {{ nombre_alumno }}!</h3>
        <p class="text-white-50 small">Estás conectado a la sala <span class="badge bg-warning text-dark">{{ pin }}</span></p>
    </div>
    
    <div class="alert alert-secondary bg-dark border-0 text-light py-3" style="border-radius: 12px;">
        <i class="bi bi-broadcast me-2 text-warning"></i> Esperando a que el profesor lance la evaluación...
    </div>

    <div class="mt-3">
        <a href="/" class="text-danger small text-decoration-none fw-bold">[ Salir de la sala ]</a>
    </div>
    <img src="{{ url_for('static', filename='img/marca-agua-azul-marino.png') }}" alt="" class="wm">
</div>

<script>
    // SINCRONIZACIÓN: Revisa cada 3 segundos si el profe ya inició el examen
    const pinSala = "{{ pin }}";
    
    const intervaloEspera = setInterval(async () => {
    try {
        let response = await fetch(`/verificar_estado_sala/${pinSala}`);
        let data = await response.json();

        if (data.estado === 'Activa') {
            window.location.href = `/examen_flash/${pinSala}`;
        } else if (data.estado === 'Cerrada') {
            clearInterval(intervaloEspera);
            document.querySelector('.alert').innerHTML = 'El examen ya cerró o el PIN no existe. Avísale a tu profesor.';
        }
    } catch (error) {
        console.log("Verificando conexión con el servidor...");
    }
}, 5000); // Revisa cada 5 segundos
</script>
</body>
</html>
