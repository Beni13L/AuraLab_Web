<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sala de Espera - AuraLab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #1a252f; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card-espera { background-color: #2c3e50; border-radius: 20px; border: none; width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .spinner-border { width: 3rem; height: 3rem; color: #3498db; }
    </style>
</head>
<body>

<div class="card card-espera p-5 text-center">
    <div class="mb-4">
        <div class="spinner-border mb-3" role="status"></div>
        <h3 class="fw-bold">¡Bienvenido, {{ nombre_alumno }}!</h3>
        <p class="text-white-50 small">Estás conectado a la sala <span class="badge bg-warning text-dark">{{ pin }}</span></p>
    </div>
    
    <div class="alert alert-secondary bg-dark border-0 text-light py-3" style="border-radius: 12px;">
        <i class="bi bi-broadcast me-2 text-warning"></i> Esperando a que el profesor lance la evaluación...
    </div>

    <div class="mt-3">
        <a href="/" class="text-danger small text-decoration-none fw-bold">[ Salir de la sala ]</a>
    </div>
</div>

<script>
    // MAGIA DE SINCRONIZACIÓN: Revisa cada 3 segundos si el profe ya inició el examen
    const pinSala = "{{ pin }}";
    
    setInterval(async () => {
        try {
            let response = await fetch(`/verificar_estado_sala/${pinSala}`);
            let data = await response.json();
            
            if (data.estado === 'Activa') {
                // Si el profe dio iniciar, redirigimos al alumno al examen en vivo
                window.location.href = `/examen_flash/${pinSala}`;
            }
        } catch (error) {
            console.log("Verificando conexión con el servidor...");
        }
    }, 3000); // Revisa cada 3 segundos
</script>

</body>
</html>
